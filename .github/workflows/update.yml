name: Full and Incremental Sync

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full synchronization'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install deps
        run: npm install pinyin-pro
        
      - name: Determine Sync Mode
        id: sync_mode
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] && [ "${{ github.event.schedule }}" == "0 18 * * 0" ]; then
            echo "FULL_SYNC=true" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.force_full }}" == "true" ]; then
            echo "FULL_SYNC=true" >> $GITHUB_ENV
          else
            echo "FULL_SYNC=false" >> $GITHUB_ENV
          fi
          
      - name: Run Sync Script
        run: node fetch.js
        
      - name: Commit Changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Update data (Mode: ${{ env.FULL_SYNC == 'true' && 'Full' || 'Incremental' }})" || exit 0
          git push
